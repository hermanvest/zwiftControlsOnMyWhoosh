[project]
name = "zwhoosh"
version = "0.2.0"
description = "Use a Zwift Ride (or Zwift Click) as a full controller for MyWhoosh on macOS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Operating System :: MacOS :: MacOS X"]
dependencies = [
    "bleak>=1.0",
    "pyobjc-framework-corebluetooth>=10",
    "pyobjc-framework-quartz>=10",
    "textual>=8",
]

[project.scripts]
zwhoosh = "zwiftcontrols.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zwiftcontrols"]

[tool.uv]
environments = ["sys_platform == 'darwin'"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
